# Local development and single-VM deployment (ADR-0005).
#   Infrastructure only:   docker compose up -d
#   Full application:      docker compose --profile app up --build
name: inn-support

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: inn_support
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inn -d inn_support']
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes: [redisdata:/data]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: inn-local
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets: [minio_password]
    volumes: [miniodata:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamdb:/var/lib/clamav]
    ports: ['127.0.0.1:3310:3310']
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    restart: unless-stopped

  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://inn:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/inn_support
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    <<: *hardening
    build: { context: ., target: api }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://inn:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/inn_support
      REDIS_URL: redis://redis:6379
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    <<: *hardening
    build: { context: ., target: worker }
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    tmpfs: [/tmp]
    depends_on:
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    <<: *hardening
    build: { context: ., target: web }
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api]

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_password:
    file: ./secrets/minio_password.txt

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamdb:
