name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every third-party action is pinned to a full commit SHA (tags can be repointed).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inn_support_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inn/api exec prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm --filter @inn/web build

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  sast:
    runs-on: ubuntu-24.04
    container: semgrep/semgrep:1.95.0@sha256:30e6afa99ebd8e7b4115d4904898108eb4bf77025819e9263f09cf14e6f6e549
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --error --config p/typescript --config p/nodejs --config p/owasp-top-ten --config .semgrep.yml

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-24.04
    needs: [test]
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          tags: inn-support-${{ matrix.target }}:ci
          load: true
          push: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inn-support-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  compose:
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare local secrets
        run: |
          mkdir -p secrets
          echo "change-me-local" > secrets/postgres_password.txt
          openssl rand -hex 16 > secrets/minio_password.txt
          cp .env.example .env
          sed -i "s|^FIELD_ENCRYPTION_KEYS=.*|FIELD_ENCRYPTION_KEYS=$(openssl rand -base64 32)|" .env
          sed -i "s|^CSRF_SECRET=.*|CSRF_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://inn:change-me-local@postgres:5432/inn_support|" .env
      - run: docker compose --profile app up -d --build postgres redis migrate api worker web
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -fsS -H 'Host: localhost' http://127.0.0.1:8080/api/v1/auth/csrf && exit 0
            sleep 3
          done
          docker compose logs api migrate
          exit 1
      - if: always()
        run: docker compose --profile app down -v
