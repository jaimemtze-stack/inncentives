# Builds multi-arch images, signs them (keyless cosign, GitHub OIDC) and, after
# the manual approval of the "production" environment, publishes a release
# whose manifest.json the VM deployer pulls. The deployer only trusts
# signatures made by THIS workflow on main.
name: mesa-soporte release

on:
  push:
    branches: [main]
    paths: ["mesa-soporte/**", ".github/workflows/mesa-soporte-*.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mesa-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/mesa-soporte-ci.yml
    permissions:
      contents: read

  images:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    strategy:
      fail-fast: true
      matrix:
        image: [api, migrator, worker, web, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mesa-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image == 'postgres' && 'mesa-soporte/docker/postgres' || 'mesa-soporte' }}
          file: ${{ matrix.image == 'postgres' && 'mesa-soporte/docker/postgres/Dockerfile' || 'mesa-soporte/docker/app.Dockerfile' }}
          target: ${{ matrix.image != 'postgres' && matrix.image || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.ref }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1 # same version the VM uses to verify
      - name: Sign by digest
        run: cosign sign --yes "${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}"
      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 7

  release:
    needs: images
    runs-on: ubuntu-24.04
    # Configure required reviewers for this environment in the repository
    # settings: nothing reaches production without a human approval.
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Manifest
        id: manifest
        run: |
          version="mesa-v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          jq -n --arg v "$version" --arg sha "$GITHUB_SHA" \
            --arg api "$(cat digests/api)" --arg worker "$(cat digests/worker)" --arg web "$(cat digests/web)" \
            --arg migrator "$(cat digests/migrator)" --arg postgres "$(cat digests/postgres)" \
            '{version:$v, commit:$sha, images:{api:$api, worker:$worker, web:$web, migrator:$migrator, postgres:$postgres}}' \
            > manifest.json
          cat manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.manifest.outputs.version }}
          files: manifest.json
          body: Release of the support desk. Images are signed with cosign (keyless) by this workflow.
