# CI of the support desk (mesa-soporte/). Third-party actions are pinned by
# commit SHA; the comment shows the version.
name: mesa-soporte CI

on:
  pull_request:
    paths: ["mesa-soporte/**", ".github/workflows/mesa-soporte-*.yml"]
  push:
    branches: [main]
    paths: ["mesa-soporte/**", ".github/workflows/mesa-soporte-*.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mesa-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mesa-soporte

env:
  NODE_VERSION: "22.22.0"

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mesa-soporte/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mesa-soporte/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mesa/shared build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration and browser tests (PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa_dev_pw
          POSTGRES_DB: mesa
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesa" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mesa-soporte/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mesa-soporte/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mesa/shared build && pnpm --filter @mesa/api exec prisma generate
      - name: S3-compatible store (SeaweedFS)
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 \
            -v "$PWD/docker/dev/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:3.97 \
            server -dir=/data -master.volumeSizeLimitMB=64 -volume.max=100 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
      - run: pnpm test:int
      - run: pnpm --filter @mesa/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: mesa-soporte/apps/web/test-results
          retention-days: 7

  operations:
    name: Backup/PITR, deployer, secrets and production-stack tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age shellcheck jq
      - name: shellcheck
        run: shellcheck -x deploy/scripts/*.sh deploy/tests/*.sh docker/postgres/*.sh infra/scripts/*.sh
      - run: deploy/tests/deployer.test.sh
      - run: deploy/tests/secrets-sync.test.sh
      - name: Build images
        run: |
          docker build -t mesa-postgres:dev docker/postgres
          for t in api migrator worker web; do
            docker build -f docker/app.Dockerfile --target "$t" -t "mesa-$t:dev" .
          done
      - run: sudo -E deploy/tests/backup-restore.test.sh
      - run: sudo -E deploy/tests/prod-stack.smoke.sh

  arm64:
    name: linux/arm64 build and smoke test (QEMU)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build arm64 images
        run: |
          docker buildx build --platform linux/arm64 -t mesa-postgres:dev --load docker/postgres
          for t in api migrator worker web; do
            docker buildx build --platform linux/arm64 -f docker/app.Dockerfile --target "$t" -t "mesa-$t:dev" --load .
          done
      - run: sudo -E deploy/tests/prod-stack.smoke.sh

  terraform:
    name: Terraform (fmt, validate, tflint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mesa-soporte/infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init && tflint --format compact

  security:
    name: Secrets, SAST, dependencies, IaC and image scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner -c /repo/mesa-soporte/.gitleaks.toml
      - name: Semgrep (SAST)
        working-directory: .
        run: >-
          docker run --rm -v "$PWD/mesa-soporte:/src" semgrep/semgrep:1.181.0
          semgrep scan --config p/default --config p/typescript --config p/nodejsscan
          --severity ERROR --error --metrics=off --exclude node_modules --exclude dist
          --sarif-output /src/semgrep.sarif /src
      - name: Semgrep report (warnings are reviewed, errors block)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: mesa-soporte/semgrep.sarif
          if-no-files-found: ignore
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: mesa-soporte/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: Trivy (IaC, Dockerfiles, compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: mesa-soporte
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: mesa-soporte/.trivyignore
      - name: Build images for scanning
        run: |
          docker build -t mesa-postgres:scan docker/postgres
          for t in api worker web; do docker build -f docker/app.Dockerfile --target "$t" -t "mesa-$t:scan" .; done
      - name: Trivy (images)
        run: |
          for i in api worker web postgres; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "mesa-$i:scan"
          done
