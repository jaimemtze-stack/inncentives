# Shared by the portal and agent server blocks (see nginx.conf.template).
# The upstream Host is the configured $server_name, never the client-supplied Host header.
# Security headers are included per location: nginx drops inherited add_header directives in any
# location that declares its own. /api/ keeps the API's stricter headers.
server_tokens off;
root /usr/share/nginx/html;
client_max_body_size 30m;

location /api/ {
  proxy_pass http://api:3000;
  proxy_set_header Host $server_name;
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  proxy_http_version 1.1;
}
location /hooks/ {
  proxy_pass http://api:3000;
  proxy_set_header Host $server_name;
}
location /assets/ {
  include /etc/nginx/inn-headers.conf;
  expires 1y;
  add_header Cache-Control "public, immutable" always;
}
location / {
  include /etc/nginx/inn-headers.conf;
  try_files $uri /index.html;
  add_header Cache-Control "no-store" always;
}
