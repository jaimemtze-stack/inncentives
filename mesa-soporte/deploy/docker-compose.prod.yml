# Production stack for the OCI Ampere A1 VM (2 OCPU / 12 GB, linux/arm64).
# Images are pinned by digest in images.env (written by deployer.sh).
# Secrets are files on a tmpfs written by secrets-sync.sh (/run/mesa/secrets).
name: mesa

x-hardening: &hardening
  read_only: true
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

x-app-env: &app-env
  NODE_ENV: production
  SECRETS_DIR: /run/secrets
  LOG_LEVEL: info
  PORTAL_HOST: ${PORTAL_HOST:?}
  AGENT_HOST: ${AGENT_HOST:?}
  PUBLIC_SCHEME: https
  TRUST_PROXY: 172.30.15.10
  TRUST_CF_CONNECTING_IP: 'true'
  STORAGE_DRIVER: ${STORAGE_DRIVER:-oci}
  OCI_REGION: ${OCI_REGION:-mx-queretaro-1}
  OCI_NAMESPACE: ${OCI_NAMESPACE:?}
  OCI_BUCKET_ATTACHMENTS: ${OCI_BUCKET_ATTACHMENTS:-adjuntos}

networks:
  # cloudflared <-> web (nginx) only; no route to the Internet.
  edge:
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  # web (nginx) <-> api only.
  app:
    internal: true
    ipam: { config: [{ subnet: 172.30.15.0/24 }] }
  # Data tier: no route to the Internet.
  data:
    internal: true
    ipam: { config: [{ subnet: 172.30.20.0/24 }] }
  # Services that need outbound access (Vault/Object Storage via the Service
  # Gateway, Microsoft Graph, Cloudflare, ClamAV signature updates).
  egress:
    ipam: { config: [{ subnet: 172.30.30.0/24 }] }

secrets:
  database_url:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/database_url
  migrator_database_url:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/migrator_database_url
  redis_url:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/redis_url
  redis_password:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/redis_password
  field_encryption_keys:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/field_encryption_keys
  smtp_username:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/smtp_username
  smtp_password:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/smtp_password
  cloudflared_token:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/cloudflared_token
  # Mailbox credential of the e-mail channel (Graph client secret or IMAP
  # password). Channels reference it by name ("graph_client_secret").
  graph_client_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/graph_client_secret
  cti_webhook_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/cti_webhook_secret
  # Phase 2 integrations. A file with the literal value "unused" (or empty)
  # leaves the integration disabled.
  azure_devops_pat:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/azure_devops_pat
  azure_devops_hook_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/azure_devops_hook_secret
  sso_entra_client_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/sso_entra_client_secret
  # Phase 3 channels and integrations ("unused" until configured).
  inncentives_api_token:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/inncentives_api_token
  inncentives_widget_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/inncentives_widget_secret
  twilio_auth_token:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/twilio_auth_token
  whatsapp_access_token:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/whatsapp_access_token
  whatsapp_app_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/whatsapp_app_secret
  whatsapp_verify_token:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/whatsapp_verify_token
  anthropic_api_key:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/anthropic_api_key
  postgres_superuser_password:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/postgres_superuser_password
  postgres_migrator_password:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/postgres_migrator_password
  postgres_app_password:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/postgres_app_password
  pgbackrest_s3_key:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/pgbackrest_s3_key
  pgbackrest_s3_key_secret:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/pgbackrest_s3_key_secret
  pgbackrest_cipher_pass:
    file: ${MESA_SECRETS_DIR:-/run/mesa/secrets}/pgbackrest_cipher_pass

services:
  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:2025.10.0
    command:
      [
        'tunnel',
        '--no-autoupdate',
        '--metrics',
        '127.0.0.1:20241',
        'run',
        '--token-file',
        '/run/secrets/cloudflared_token',
      ]
    user: '65532:65532'
    secrets: [cloudflared_token]
    networks: [edge, egress]
    depends_on: [web]
    mem_limit: 256m
    pids_limit: 200

  web:
    <<: *hardening
    image: ${IMAGE_WEB:?}
    user: '101:101'
    tmpfs: ['/tmp:size=32m,uid=101,gid=101']
    networks:
      edge: {}
      app: { ipv4_address: 172.30.15.10 }
    depends_on: [api]
    mem_limit: 256m
    pids_limit: 200

  api:
    <<: *hardening
    image: ${IMAGE_API:?}
    environment: *app-env
    secrets:
      - database_url
      - redis_url
      - field_encryption_keys
      - cti_webhook_secret
      - azure_devops_pat
      - azure_devops_hook_secret
      - sso_entra_client_secret
      - inncentives_api_token
      - inncentives_widget_secret
      - twilio_auth_token
      - whatsapp_access_token
      - whatsapp_app_secret
      - whatsapp_verify_token
      - anthropic_api_key
    tmpfs: ['/tmp:size=64m']
    networks: [app, data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g
    pids_limit: 300

  worker:
    <<: *hardening
    image: ${IMAGE_WORKER:?}
    environment:
      NODE_ENV: production
      SECRETS_DIR: /run/secrets
      # "graph" (recommended) sends through Microsoft Graph instead of SMTP AUTH.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: starttls
      MAIL_FROM: ${MAIL_FROM:?}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-}
    secrets: [redis_url, smtp_username, smtp_password, graph_client_secret]
    tmpfs: ['/tmp:size=32m']
    networks: [egress, data]
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 512m
    pids_limit: 200

  # Queues and periodic work (mail fetch/send, SLA, schedulers, scans,
  # retention, privacy tasks). Same image as the API, no HTTP listener.
  jobs:
    <<: *hardening
    image: ${IMAGE_API:?}
    command: ['--enable-source-maps', 'dist/jobs-main.js']
    environment:
      <<: *app-env
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    secrets:
      - database_url
      - redis_url
      - field_encryption_keys
      - graph_client_secret
      - azure_devops_pat
      - twilio_auth_token
      - whatsapp_access_token
    tmpfs: ['/tmp:size=128m']
    networks: [data, egress]
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g
    pids_limit: 300

  # One-shot: `docker compose run --rm migrator` (deployer.sh does it).
  migrator:
    <<: *hardening
    image: ${IMAGE_MIGRATOR:?}
    restart: 'no'
    profiles: ['migrate']
    entrypoint:
      [
        '/nodejs/bin/node',
        '-e',
        "process.env.DATABASE_URL=require('fs').readFileSync('/run/secrets/migrator_database_url','utf8').trim();require('child_process').execFileSync('/nodejs/bin/node',['node_modules/prisma/build/index.js','migrate','deploy'],{stdio:'inherit'})",
      ]
    secrets: [migrator_database_url]
    tmpfs: ['/tmp:size=64m']
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: ${IMAGE_POSTGRES:?}
    user: '5432:5432'
    environment:
      POSTGRES_DB: mesa
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_STANZA: mesa
      BACKUP_S3_ENDPOINT: ${OCI_NAMESPACE:?}.compat.objectstorage.${OCI_REGION:-mx-queretaro-1}.oraclecloud.com
      BACKUP_S3_BUCKET: ${BACKUP_BUCKET:-respaldos-pitr}
      BACKUP_S3_REGION: ${OCI_REGION:-mx-queretaro-1}
      BACKUP_RETENTION_DAYS: '35'
      PG_SHARED_BUFFERS: 1GB
      PG_EFFECTIVE_CACHE_SIZE: 3GB
    secrets:
      - postgres_superuser_password
      - postgres_migrator_password
      - postgres_app_password
      - pgbackrest_s3_key
      - pgbackrest_s3_key_secret
      - pgbackrest_cipher_pass
    volumes:
      - ${MESA_DATA_DIR:-/srv/mesa}/pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:size=8m,uid=5432,gid=5432,mode=2775
      - /etc/pgbackrest:size=1m,uid=5432,gid=5432,mode=0700
      - /var/spool/pgbackrest:size=256m,uid=5432,gid=5432,mode=0700
      - /var/log/pgbackrest:size=64m,uid=5432,gid=5432,mode=0700
      - /tmp:size=64m,uid=5432,gid=5432
    shm_size: 256m
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-h', '/var/run/postgresql']
      interval: 10s
      timeout: 5s
      retries: 5
      # First start runs initdb (slow on small or emulated CPUs).
      start_period: 180s
    # pgBackRest pushes WAL to Object Storage, so this service needs egress.
    networks: [data, egress]
    mem_limit: 3g
    pids_limit: 400

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    user: '999:1000'
    entrypoint:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy noeviction --protected-mode yes --rename-command FLUSHALL '''' --rename-command CONFIG ''''',
      ]
    secrets: [redis_password]
    volumes:
      - ${MESA_DATA_DIR:-/srv/mesa}/redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]
    mem_limit: 512m
    pids_limit: 100

  clamav:
    <<: *hardening
    profiles: ['${CLAMAV_PROFILE:-default}']
    image: clamav/clamav-debian:1.4
    read_only: false
    cap_add: ['CHOWN', 'SETUID', 'SETGID', 'DAC_OVERRIDE']
    volumes:
      - ${MESA_DATA_DIR:-/srv/mesa}/clamav:/var/lib/clamav
    networks: [data, egress]
    mem_limit: 3g
    pids_limit: 200
