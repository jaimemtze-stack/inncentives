# Serves the web app and proxies the API (nginx-unprivileged, uid 101).
# Plain HTTP inside the private Docker network: TLS terminates at Cloudflare
# and travels through the encrypted Cloudflare Tunnel (cloudflared is the only
# client of this port).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and inbound webhooks. The original Host header is preserved: the API
    # decides between the portal and agents areas with it. CF-Connecting-IP
    # passes through untouched; the API trusts it only from this proxy.
    location ~ ^/(api|hooks)/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    # Attachment uploads (the API enforces the configured limit, 25 MB by default).
    location = /api/v1/attachments {
        client_max_body_size 26m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Realtime (Socket.IO over WebSocket). The API authenticates the upgrade
    # with the session cookie and checks Host and Origin.
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Script embedded by the Inncentives administrative system (cross-origin).
    location = /widget.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
