# Serves the web app and proxies the API (nginx-unprivileged, uid 101).
# Plain HTTP inside the private Docker network: TLS terminates at Cloudflare
# and travels through the encrypted Cloudflare Tunnel (cloudflared is the only
# client of this port).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and inbound webhooks. The original Host header is preserved: the API
    # decides between the portal and agents areas with it. CF-Connecting-IP
    # passes through untouched; the API trusts it only from this proxy.
    location ~ ^/(api|hooks)/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
