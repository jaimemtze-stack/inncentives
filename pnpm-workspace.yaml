packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - prisma
# Supply-chain hardening: wait 7 days before installing newly published versions,
# refuse git/tarball sub-dependencies and trust-level downgrades.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Only enforce trust checks on versions published in the last year (takeovers are recent).
trustPolicyIgnoreAfter: 525600
# Exact-version exceptions, each verified by hand:
# - vite@5.4.21: maintenance release published by the official `vitebot` with SLSA provenance;
#   flagged only because a newer branch had already moved to trusted publishing. Build-time only.
trustPolicyExclude:
  - vite@5.4.21
